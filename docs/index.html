<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeBuilds — Chinese Indie Developer Projects</title>
  <meta name="description" content="Discover what Chinese indie devs are building. Get ideas. Get inspired. 2700+ projects across AI, games, tools, and more.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="site-name"><img src="logo.png" alt="Le" class="site-logo"><span class="builds-text">Builds</span></h1>
        <span class="tagline">Discover what Chinese indie devs are building. Get ideas. Get inspired.</span>
      </div>
      <div class="header-actions">
        <button class="lang-toggle" id="lang-toggle" title="Toggle language">EN</button>
        <button class="random-btn" id="random-btn" title="Pick a random project">🎲 Random</button>
        <button class="favorites-toggle" id="favorites-toggle" title="Show favorites only">★ Favorites</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <p class="hero-stats" id="stats"></p>
  </section>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search" placeholder="Search projects..." autocomplete="off">
    </div>
    <div class="filters">
      <div class="filter-group">
        <label>Board</label>
        <div class="filter-buttons" id="board-filters">
          <button class="active" data-board="all">All</button>
          <button data-board="main">Main</button>
          <button data-board="programmer">Programmer</button>
          <button data-board="game">Game</button>
          <button data-board="archive">Archive</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Status</label>
        <div class="filter-buttons" id="status-filters">
          <button class="active" data-status="all">All</button>
          <button data-status="live">Live</button>
          <button data-status="dev">In Dev</button>
          <button data-status="closed">Closed</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Category</label>
        <div class="filter-buttons" id="category-filters">
          <button class="active" data-tag="all">All</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Sort</label>
        <select id="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name-asc">Name A-Z</option>
          <option value="name-desc">Name Z-A</option>
        </select>
      </div>
    </div>
  </div>

  <div class="results-info" id="results-info"></div>

  <div class="grid" id="project-grid"></div>

  <div class="loading" id="loading">Loading projects...</div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <footer>
    <p>Data from <a href="https://github.com/1c7/chinese-independent-developer" target="_blank">1c7/chinese-independent-developer</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
